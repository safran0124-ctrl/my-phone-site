<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>윤정한의 휴대폰</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#202024;color:white;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.phone{max-width:430px;margin:auto;min-height:100dvh;background:#000;overflow:hidden}
.status{height:29px;padding:6px 15px;display:flex;justify-content:space-between;background:#080808;font-size:12px}
.hardware{height:22px;background:#080808;display:flex;justify-content:center;align-items:center}
.speaker{width:75px;height:6px;border-radius:8px;background:#303035}
.screen{height:calc(100dvh - 95px);min-height:570px;overflow:auto;background:#000;position:relative}
.home{min-height:100%;padding:20px 15px 16px;display:flex;flex-direction:column;background:linear-gradient(150deg,#7ddcf5,#1684e5 43%,#06459b 80%,#08172e)}
.clock{font-size:55px;font-weight:200;text-align:center;margin:10px 0 2px}
.date{text-align:center;font-size:14px;margin-bottom:25px}
.notice{padding:12px;background:#163a64d9;border:1px solid #ffffff55;border-radius:11px;margin-bottom:25px;font-size:13px;line-height:1.5;cursor:pointer}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 4px}
.app{border:0;background:none;color:white;font-size:11px;display:flex;align-items:center;flex-direction:column;gap:6px;padding:0}
.ico{width:56px;height:56px;border-radius:13px;display:grid;place-items:center;font-size:29px;background:linear-gradient(#ffffff80,transparent 50%),var(--c);border:1px solid #ffffff88;box-shadow:inset 0 -4px 6px #0003,0 3px 5px #0005}
.dock{margin-top:auto;padding:15px 0 0;display:grid;grid-template-columns:repeat(4,1fr);background:#003d8a55;border-radius:12px}
.bottom{height:44px;background:linear-gradient(#292a2e,#111);display:flex;align-items:center;justify-content:space-around;border-top:1px solid #444}
.homekey{width:72px;height:26px;border:2px solid #666;border-radius:9px;background:transparent}
.head{height:49px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#414247,#1a1a1e);border-bottom:1px solid #555;position:sticky;top:0;z-index:3;font-weight:600}
.head button{border:0;background:none;color:#72baff;font-size:14px}
.item{padding:12px;border-bottom:1px solid #292929;display:flex;align-items:center;gap:11px;cursor:pointer;min-height:65px}
.mini{width:43px;height:43px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:linear-gradient(#ffffff55,transparent),var(--c);flex-shrink:0}
.sub{font-size:12px;color:#aaa;line-height:1.5;margin-top:4px}
.main{min-width:0;flex:1}
.badge{background:#e94b43;color:white;border-radius:14px;min-width:21px;text-align:center;padding:2px 6px;font-size:11px}
.thread{display:flex;flex-direction:column;min-height:100%;background:#000}
.contactbar{text-align:center;color:#999;font-size:12px;padding:9px;border-bottom:1px solid #222}
.bubbles{padding:12px 10px 18px;display:flex;flex-direction:column;gap:9px;flex:1}
.bubble{max-width:88%;padding:10px 12px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.incoming{align-self:flex-start;background:#303034;border-radius:16px 16px 16px 5px}
.outgoing{align-self:flex-end;background:#258b39;border-radius:16px 16px 5px 16px}
.stamp{text-align:center;font-size:10px;color:#777;margin:10px 0 3px}
.compose{position:sticky;bottom:0;display:flex;gap:7px;align-items:center;padding:10px;background:#151517;border-top:1px solid #292929}
.compose input{flex:1;min-width:0;border:1px solid #4a4a4f;border-radius:20px;padding:12px;background:#080808;color:white;font-size:14px}
.blue{background:linear-gradient(#5cbaff,#0875ce);border:0;color:white;border-radius:9px;padding:12px}
.note{margin:12px;background:#fff09c;color:#40391e;padding:13px;border-radius:4px;line-height:1.65}
.note textarea{width:100%;height:130px;background:transparent;border:0;color:#40391e;font:inherit;resize:vertical}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:4px}
.photo{aspect-ratio:1;background:linear-gradient(145deg,#426777,#10151e);padding:10px;display:flex;align-items:end;font-size:12px;cursor:pointer}
.news{background:#f3f3f3;color:#161616;padding:13px;line-height:1.6;min-height:100%}
.news article{padding:13px;background:white;border-bottom:1px solid #ddd;cursor:pointer}
.center{text-align:center;padding:50px 18px}
.callbtn{background:#df3933;border:0;border-radius:50%;width:60px;height:60px;color:white;font-size:23px}
</style>
</head>
<body>
<div class="phone">
<div class="status"><span id="statusTime">오후 11:49</span><span>▮▮▮ 3G ▣ 23%</span></div>

let page='home',active='홍지수',unread=8,notificationIndex=0;
const $=id=>document.getElementById(id);

function esc(s){
return String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
}

function header(t){
return `<div class="head"><button onclick="back()">‹ 뒤로</button><span>${esc(t)}</span><span>⋯</span></div>`;
}

function app(t,icon,color,id){
return `<button class="app" onclick="openApp('${id}')"><span class="ico" style="--c:${color}">${icon}</span>${t}</button>`;
}

function home(){

$('screen').innerHTML=`

function openApp(id){
page=id;
let title={
contacts:'연락처',phone:'전화',messages:'메시지',
gallery:'갤러리',notes:'메모',music:'음악',
record:'음성 녹음',news:'인터넷',
calendar:'달력',clock:'시계'
}[id]||id;
let h=header(title);

if(id==='messages'){
h+=Object.keys(threads).map(n=>{
let last=[...(threads[n]||[])].reverse().find(x=>x[0]!=='stamp');
return `<div class="item" onclick="chat('${n}')">
<div class="mini" style="--c:#d5a72b">✉</div>
<div class="main">${esc(n)}<div class="sub">${esc(last?last[1]:'')}</div></div>
${n==='홍지수'?'<span class="badge">8</span>':'›'}
</div>`;
}).join('');
}

h+=people.map(p=>`
<div class="item" onclick="${id==='phone'?`call('${p[0]}')`:`detail('${p[0]}')`}">
<div class="mini" style="--c:#69717d">♟</div>
<div>${esc(p[0])}<div class="sub">${p[2]} · ${esc(p[1])}</div></div>
</div>`).join('');
}

${[

['항구 창고','마지막 잠복 장소'],

<textarea id="memo">- 꽃 선물할 거
- 반지 선물할 거
- 내일 데이트

if(id==='music'||id==='record'){

<div class="mini" style="--c:#8038a5">♫</div>
<div>증인의 목소리<div class="sub">녹음 파일 · 탭하여 확인</div></div></div>

$('screen').innerHTML=h;

function chat(name){
active=name;
page='chat';
let arr=threads[name]||[];
$('screen').innerHTML=`
<div class="thread">
${header(name)}
<div class="contactbar">문자 메시지 · ${people.find(p=>p[0]===name)?.[2]||''}</div>
<div class="bubbles" id="bubbles">
${arr.map(m=>m[0]==='stamp'
?`<div class="stamp">${esc(m[1])}</div>`
:`<div class="bubble ${m[0]==='out'?'outgoing':'incoming'}">${esc(m[1])}</div>`
).join('')}
</div>
<form class="compose" onsubmit="send(event)">
<input id="msg" placeholder="문자 메시지" autocomplete="off">
<button class="blue">보내기</button>
</form>
</div>`;
let b=$('bubbles');
if(b)b.scrollTop=b.scrollHeight;
}

function send(e){
e.preventDefault();
let input=$('msg'),v=input.value.trim();
if(!v)return;
let b=$('bubbles');
b.insertAdjacentHTML('beforeend',`<div class="bubble outgoing">${esc(v)}</div>`);
input.value='';
b.scrollTop=b.scrollHeight;
if(active==='홍지수'){
setTimeout(()=>{
if(page==='chat'&&active==='홍지수')
b.insertAdjacentHTML('beforeend','<div class="stamp">메시지가 아직 전달되지 않았습니다.</div>');
},1300);
}else if(active==='알 수 없는 번호'){
setTimeout(()=>{
if(page==='chat'&&active==='알 수 없는 번호')
b.insertAdjacentHTML('beforeend','<div class="bubble incoming">답장을 보낼 줄은 몰랐네. 항구로 와.</div>');
},1600);
}
}

function detail(n){
let p=people.find(x=>x[0]===n);
page='detail';
$('screen').innerHTML=header('연락처')+
`<div class="center" style="font-size:26px">♟<p>${esc(p[0])}</p>
<div class="sub">${p[2]}<br>${esc(p[1])}</div></div>
<div class="item" onclick="call('${p[0]}')">☎ 전화 걸기</div>
<div class="item" onclick="chat('${p[0]}')">✉ 메시지 보기</div>`;
}

function call(n){
page='call';
$('screen').innerHTML=header('전화')+
`<div class="center"><div style="font-size:25px">${esc(n)}</div>
<p class="sub">발신 중…</p>
<button class="callbtn" onclick="alert('응답 없음');back()">☎</button>
<p class="sub">통화 종료</p></div>`;
}

function track(i){
$('track').textContent=i===0
?'▶ 녹음 내용: “그 사람은 혼자가 아니었어요. 횟집 직원 중 한 명이…”'
:'▶ 파도 소리와 금속문이 닫히는 소리. 멀리서 세 번의 발걸음이 들린다.';
}

function back(){home()}

function updateTime(){
let d=new Date();
$('statusTime').textContent=d.toLocaleTimeString('ko-KR',{
hour:'2-digit',minute:'2-digit',hour12:true
});
if($('clock'))$('clock').textContent=d.toLocaleTimeString('ko-KR',{
hour:'2-digit',minute:'2-digit',hour12:false
});
}
home();
updateTime();
setInterval(updateTime,30000);

const alerts=[
['홍지수','정한아, 제발 무사하다고 한마디만 해 줘.'],
['최승철','윤정한 형사 응답 바람. 전원 수색 중이다.'],
['전원우','마지막 신호가 끊긴 위치 확인했어.'],
['부승관','형, 지수 씨가 경찰서에서 기다려요.'],
['김민규','형, 전화 한 번만 받아 줘. 다들 걱정해.'],
['이지훈','선배님, 무사하시면 답장 부탁드립니다.']
];

setInterval(()=>{
if(page==='home'){
$('badge').textContent=++unread;
let a=alerts[notificationIndex++%alerts.length];
$('noticeText').textContent=a[0]+': '+a[1];
}
},35000);
</script>
</body>
</html>
